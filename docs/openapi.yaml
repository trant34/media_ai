openapi: "3.0.3"

info:
  title: Media AI Gateway
  version: "1.0.0"
  description: |
    Realtime audio gateway — nhận RTP/WebRTC từ hạ tầng IMS/telecom, xử lý audio,
    gửi sang AI worker (STT/translate) qua gRPC streaming, trả kết quả về backend
    qua HTTP callback hoặc WebRTC DataChannel.

servers:
  - url: http://localhost:8080
    description: Control plane (HTTP/2 h2c)
  - url: http://localhost:9090
    description: Metrics server (Prometheus scrape target)

tags:
  - name: sessions
    description: Quản lý session — tạo, truy vấn, xoá
  - name: webrtc
    description: WebRTC signaling — offer/answer exchange
  - name: gateway
    description: Gateway cluster — heartbeat và registry
  - name: health
    description: Health probes cho Kubernetes liveness / readiness
  - name: observability
    description: Stats JSON và Prometheus metrics

# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Sessions ──────────────────────────────────────────────────────────────

  /v1/sessions:
    post:
      tags: [sessions]
      summary: Tạo session mới
      description: |
        Tạo một audio session. Với `source_type=raw_rtp`, gateway allocate một
        UDP port riêng và trả về `rtp_ip` + `rtp_port` để caller gửi RTP vào.
        Với `source_type=webrtc`, cần gọi tiếp `POST /v1/webrtc/offer`.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            examples:
              raw_rtp:
                summary: Raw RTP session
                value:
                  id: "call-abc-001"
                  source_type: "raw_rtp"
                  codec: "PCMU"
                  sample_rate: 8000
                  ssrc: 12345
                  remote_addr: "192.168.1.10:5100"
                  callback_url: "http://backend/callback"
              webrtc:
                summary: WebRTC session
                value:
                  id: "call-abc-002"
                  source_type: "webrtc"
                  codec: "opus"
                  sample_rate: 48000
                  channels: 2
                  language: "vi"
                  task: "transcribe"
      responses:
        "201":
          description: Session tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              example:
                session_id: "call-abc-001"
                status: "CREATED"
                source_type: "raw_rtp"
                codec: "PCMU"
                sample_rate: 8000
                channels: 1
                created_at: "2026-06-18T08:00:00Z"
                gateway_id: "gw-node-1"
                rtp_ip: "192.168.100.10"
                rtp_port: 40000
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Session ID đã tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/sessions/{id}:
    get:
      tags: [sessions]
      summary: Lấy thông tin session
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Thông tin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [sessions]
      summary: Đóng và xoá session
      description: Giải phóng pipeline, RTP port, AI stream. Idempotent — 404 nếu không tồn tại.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "204":
          description: Session đã được xoá
        "404":
          $ref: "#/components/responses/NotFound"

  # ── WebRTC ────────────────────────────────────────────────────────────────

  /v1/webrtc/offer:
    post:
      tags: [webrtc]
      summary: WebRTC offer/answer exchange
      description: |
        Nhận SDP offer từ caller, tạo PeerConnection, trả SDP answer.
        Session phải được tạo trước qua `POST /v1/sessions` với `source_type=webrtc`.

        **Luồng:**
        1. `POST /v1/sessions` → nhận `session_id`
        2. `POST /v1/webrtc/offer` với SDP offer → nhận SDP answer
        3. ICE negotiation diễn ra giữa caller và gateway
        4. Audio stream bắt đầu chạy qua pipeline
      operationId: webrtcOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferRequest"
            example:
              session_id: "call-abc-002"
              type: "offer"
              sdp: "v=0\r\no=- 123456 2 IN IP4 127.0.0.1\r\n..."
      responses:
        "200":
          description: SDP answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
              example:
                session_id: "call-abc-002"
                type: "answer"
                sdp: "v=0\r\no=- 654321 2 IN IP4 192.168.100.10\r\n..."
                udp_proxy_port: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Gateway cluster ───────────────────────────────────────────────────────

  /v1/gateways/{id}/heartbeat:
    put:
      tags: [gateway]
      summary: Gateway node heartbeat
      description: |
        Gateway node gửi heartbeat định kỳ để cập nhật trạng thái tài nguyên
        trong cluster registry. TTL mặc định 30 giây — node không heartbeat sẽ
        bị coi là stale và loại khỏi danh sách định tuyến.
      operationId: gatewayHeartbeat
      parameters:
        - name: id
          in: path
          required: true
          description: Gateway node ID
          schema:
            type: string
          example: "gw-node-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayInfo"
            example:
              id: "gw-node-1"
              addr: "192.168.100.10:8080"
              rtp_public_ip: "192.168.100.10"
              sessions: 42
              max_sessions: 100
              ai_streams: 10
              max_ai_streams: 50
              cpu_usage: 0.35
              audio_queue_usage: 0.12
              rtp_port_start: 40000
              rtp_port_end: 40999
              used_ports: 42
      responses:
        "200":
          description: Heartbeat nhận thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Health ────────────────────────────────────────────────────────────────

  /health/live:
    get:
      tags: [health]
      summary: Kubernetes liveness probe
      description: Luôn trả 200 khi process đang chạy.
      operationId: healthLive
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /health/ready:
    get:
      tags: [health]
      summary: Kubernetes readiness probe
      description: |
        Trả 200 khi gateway sẵn sàng nhận traffic mới.
        Trả 503 kèm lý do khi admission sẽ từ chối session:
        - `session_limit` — sessions đạt max
        - `ai_stream_limit` — AI streams đạt max
        - `no_ai_worker` — không có AI worker nào khả dụng
        - `queue_full` — worker pool queue đầy
      operationId: healthReady
      responses:
        "200":
          description: Gateway ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ready"
        "503":
          description: Gateway not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "not_ready"
                  reason:
                    type: string
                    example: "session_limit"
                  retry_after_ms:
                    type: integer
                    format: int64
                    example: 5000

  # ── Observability ─────────────────────────────────────────────────────────

  /v1/stats:
    get:
      tags: [observability]
      summary: JSON stats snapshot
      description: Snapshot tức thời các counter và gauge của gateway.
      operationId: getStats
      responses:
        "200":
          description: Stats snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format (version 0.0.4).

        **Server:** port `:9090` khi `metrics_addr` khác `http_addr` trong config.
        Nếu không cấu hình `metrics_addr`, endpoint này cũng available trên `:8080`.

        **Metrics chính:**
        | Metric | Type | Mô tả |
        |--------|------|-------|
        | `media_ai_sessions_active` | gauge | Sessions đang active |
        | `media_ai_rtp_packets_total` | counter | RTP packets nhận từ UDP |
        | `media_ai_rtp_packets_routed_total` | counter | Packets route thành công |
        | `media_ai_pool_processed_total` | counter | Audio jobs processed |
        | `media_ai_dispatcher_sent_total` | counter | Kết quả gửi callback |
        | `media_ai_callback_retry_total` | counter | Callback retry attempts |
        | `media_ai_ai_reconnects_total` | counter | AI gRPC reconnects |
      operationId: getMetrics
      servers:
        - url: http://localhost:9090
          description: Metrics server
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP media_ai_sessions_active Active session count
                # TYPE media_ai_sessions_active gauge
                media_ai_sessions_active 5

# ─────────────────────────────────────────────────────────────────────────────
components:

  parameters:
    sessionId:
      name: id
      in: path
      required: true
      description: Session ID (phải khớp với `id` trong CreateSessionRequest)
      schema:
        type: string
      example: "call-abc-001"

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource không tồn tại
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Lỗi server nội bộ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Gateway quá tải hoặc không đủ tài nguyên
      headers:
        Retry-After:
          description: Thời gian chờ khuyến nghị (giây)
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "service at capacity, try again later"
            retry_after_ms: 5000

  schemas:

    # ── Requests ────────────────────────────────────────────────────────────

    CreateSessionRequest:
      type: object
      required: [id, codec, sample_rate]
      properties:
        id:
          type: string
          description: Session ID duy nhất do caller cấp
          example: "call-abc-001"
        source_type:
          type: string
          enum: [raw_rtp, webrtc]
          default: raw_rtp
          description: Loại ingress
        ssrc:
          type: integer
          format: int64
          description: RTP SSRC. Dùng cho shared-port routing. 0 = fallback sang remote_addr
          example: 12345
        payload_type:
          type: integer
          format: int32
          description: RTP payload type (0–127). 0 = tự suy từ codec
        codec:
          type: string
          enum: [PCMU, PCMA, opus]
          description: Audio codec
          example: "PCMU"
        sample_rate:
          type: integer
          description: Sample rate Hz
          example: 8000
        channels:
          type: integer
          default: 1
          description: Số kênh audio
          example: 1
        language:
          type: string
          description: BCP-47 language tag gửi sang AI worker
          example: "vi"
        task:
          type: string
          description: AI task type (tuỳ AI worker định nghĩa)
          example: "transcribe"
        callback_url:
          type: string
          format: uri
          description: HTTP endpoint nhận kết quả STT/translate
          example: "http://backend.svc/api/asr/callback"
        remote_addr:
          type: string
          description: |
            UDP source address "ip:port" của caller.
            Dùng làm fallback routing khi SSRC=0 trong shared ingress mode.
          example: "192.168.1.10:5100"

    OfferRequest:
      type: object
      required: [session_id, sdp, type]
      properties:
        session_id:
          type: string
          description: Session ID đã tạo qua POST /v1/sessions
          example: "call-abc-002"
        sdp:
          type: string
          description: SDP offer body
        type:
          type: string
          enum: [offer]
          description: Phải là "offer"

    GatewayInfo:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Gateway node ID
          example: "gw-node-1"
        addr:
          type: string
          description: HTTP/2 control plane address của node này
          example: "192.168.100.10:8080"
        rtp_public_ip:
          type: string
          description: Public IP của macvlan/RTP interface
          example: "192.168.100.10"
        sessions:
          type: integer
          description: Sessions đang active
          example: 42
        max_sessions:
          type: integer
          example: 100
        ai_streams:
          type: integer
          description: AI gRPC streams đang active
          example: 10
        max_ai_streams:
          type: integer
          example: 50
        cpu_usage:
          type: number
          format: double
          description: CPU usage 0..1
          example: 0.35
        audio_queue_usage:
          type: number
          format: double
          description: Audio worker queue fill ratio 0..1
          example: 0.12
        rtp_port_start:
          type: integer
          example: 40000
        rtp_port_end:
          type: integer
          example: 40999
        used_ports:
          type: integer
          description: Per-session RTP ports đang sử dụng
          example: 42
        last_heartbeat_ms:
          type: integer
          format: int64
          description: Unix timestamp ms do sender báo cáo

    # ── Responses ───────────────────────────────────────────────────────────

    SessionResponse:
      type: object
      properties:
        session_id:
          type: string
          example: "call-abc-001"
        status:
          type: string
          enum: [CREATED, ACTIVE, CLOSED, ERROR]
          example: "CREATED"
        source_type:
          type: string
          enum: [raw_rtp, webrtc]
          example: "raw_rtp"
        codec:
          type: string
          example: "PCMU"
        sample_rate:
          type: integer
          example: 8000
        channels:
          type: integer
          example: 1
        language:
          type: string
          example: "vi"
        task:
          type: string
          example: "transcribe"
        created_at:
          type: string
          format: date-time
          example: "2026-06-18T08:00:00Z"
        gateway_id:
          type: string
          description: Node identity (chỉ có trong CREATE response)
          example: "gw-node-1"
        rtp_ip:
          type: string
          description: Public IP để gửi RTP vào (chỉ có trong CREATE response, raw_rtp)
          example: "192.168.100.10"
        rtp_port:
          type: integer
          description: UDP port để gửi RTP vào (chỉ có trong CREATE response, raw_rtp)
          example: 40000

    AnswerResponse:
      type: object
      properties:
        session_id:
          type: string
          example: "call-abc-002"
        sdp:
          type: string
          description: SDP answer body
        type:
          type: string
          enum: [answer]
          example: "answer"
        udp_proxy_port:
          type: integer
          description: |
            UDP proxy port cho IMS App Server → UE relay mode (AC.6-2).
            0 = UDP proxy không được bật.
          example: 0

    StatsResponse:
      type: object
      properties:
        sessions:
          type: integer
          description: Sessions đang active
        ai_streams:
          type: integer
          description: AI gRPC streams đang active
        pool:
          $ref: "#/components/schemas/PoolStats"
        dispatcher:
          $ref: "#/components/schemas/DispatcherStats"
        ai:
          $ref: "#/components/schemas/AIStats"

    PoolStats:
      type: object
      properties:
        submitted:
          type: integer
          format: int64
        dropped:
          type: integer
          format: int64
        processed:
          type: integer
          format: int64
        decode_errors:
          type: integer
          format: int64
        active_sessions:
          type: integer
        queue_len:
          type: integer

    DispatcherStats:
      type: object
      properties:
        pushed:
          type: integer
          format: int64
        dropped:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        sent_partial:
          type: integer
          format: int64
        sent_final:
          type: integer
          format: int64
        send_errors:
          type: integer
          format: int64
        queue_len:
          type: integer

    AIStats:
      type: object
      properties:
        total_send_errors:
          type: integer
          format: int64
        total_recv_errors:
          type: integer
          format: int64
        total_retries:
          type: integer
          format: int64

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "session not found"
        retry_after_ms:
          type: integer
          format: int64
          description: Thời gian chờ khuyến nghị trước khi retry (ms). 0 = không retry.
          example: 5000
